<aside class="flex h-screen w-56 flex-col bg-sidebar">

  <!-- Logo -->
  <div class="border-b border-white/10 px-4 py-5">
    <img src="paranalogo.png" alt="Mapa do Paraná" class="mb-2 h-10 w-10 object-contain" />
    <span class="block text-sm font-medium text-white">Conecta Paraná</span>
    <span class="block text-xs text-white/50">Painel municipal</span>
  </div>

  <!-- Navegação -->
  <nav class="flex-1 px-2 py-3">

    <!-- Grupo Geral -->
    <p class="mb-1 px-2 text-[10px] font-medium uppercase tracking-widest text-white/40">Geral</p>
    @for (item of items(); track item.route) {
      @if (item.group === 'Geral') {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-sidebar-active text-white font-medium"
          [routerLinkActiveOptions]="{ exact: false }"
          class="mb-0.5 flex items-center gap-2.5 rounded-md px-2.5 py-2 text-sm text-sidebar-text transition-colors hover:bg-sidebar-hover hover:text-white"
        >
          <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            @switch (item.icon) {
              @case ('pencil-square') {
                <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
              }
              @case ('calendar-days') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
              }
              @case ('newspaper') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 0 1-2.25 2.25M16.5 7.5V18a2.25 2.25 0 0 0 2.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 0 0 2.25 2.25h13.5M6 7.5h3v3H6v-3Z" />
              }
              @case ('map-pin') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
              }
            }
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    }

    <!-- Grupo Gestão -->
    <p class="mb-1 mt-4 px-2 text-[10px] font-medium uppercase tracking-widest text-white/40">Gestão</p>
    @for (item of items(); track item.route) {
      @if (item.group === 'Gestão') {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-sidebar-active text-white font-medium"
          [routerLinkActiveOptions]="{ exact: false }"
          class="mb-0.5 flex items-center gap-2.5 rounded-md px-2.5 py-2 text-sm text-sidebar-text transition-colors hover:bg-sidebar-hover hover:text-white"
        >
          <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            @switch (item.icon) {
              @case ('bell') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
              }
              @case ('chat') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.966 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z" />
              }
              @case ('users') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
              }
            }
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    }
  </nav>

  <!-- Rodapé -->
  <div class="border-t border-white/10 p-2">
    <button
      type="button"
      (click)="logout.emit()"
      class="flex w-full items-center gap-2.5 rounded-md px-2.5 py-2 text-sm text-white/60 transition-colors hover:bg-sidebar-hover hover:text-white cursor-pointer"
    >
      <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25" />
      </svg>
      <span>Sair</span>
    </button>
  </div>

</aside>
