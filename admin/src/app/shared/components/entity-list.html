<div class="mt-4 space-y-3">
  @for (item of items(); track $index) {
    <div class="flex items-center justify-between rounded-2xl bg-card border border-border px-5 py-4 shadow-[var(--shadow-card)] hover:shadow-[var(--shadow-elevated)] hover:-translate-y-0.5 transition-all">
      <div class="min-w-0 flex-1">
        <ng-container
          [ngTemplateOutlet]="rowTemplate()"
          [ngTemplateOutletContext]="{ $implicit: item }"
        />
      </div>
      <div class="ml-4 flex shrink-0 items-center gap-1">
        <button
          type="button"
          (click)="edit.emit(item)"
          aria-label="Editar"
          class="size-9 cursor-pointer rounded-lg text-muted-foreground transition-colors hover:text-primary hover:bg-primary/10 flex items-center justify-center"
        >
          <span [innerHTML]="editIcon"></span>
        </button>
        <button
          type="button"
          (click)="delete.emit(item)"
          aria-label="Excluir"
          class="size-9 cursor-pointer rounded-lg text-destructive transition-colors hover:bg-destructive/10 flex items-center justify-center"
        >
          <span [innerHTML]="deleteIcon"></span>
        </button>
      </div>
    </div>
  } @empty {
    <div class="flex flex-col items-center justify-center py-16 text-center">
      <div class="gradient-primary mb-4 flex h-14 w-14 items-center justify-center rounded-2xl shadow-[var(--shadow-elevated)]">
        <svg class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
        </svg>
      </div>
      <p class="text-[15px] font-semibold text-foreground">Nenhum item encontrado</p>
      <p class="mt-1 text-sm text-muted-foreground">Clique em "Criar" para adicionar o primeiro.</p>
    </div>
  }
</div>
