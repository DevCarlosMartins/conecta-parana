<div class="admin-card mt-5 overflow-hidden rounded-3xl">
  @for (item of items(); track $index) {
    <div
      class="admin-card-hover flex items-center justify-between gap-5 border-b border-emerald-50 px-5 py-4 last:border-b-0 hover:bg-emerald-50/50"
    >
      <div class="min-w-0 flex-1">
        <ng-container
          [ngTemplateOutlet]="rowTemplate()"
          [ngTemplateOutletContext]="{ $implicit: item }"
        />
      </div>

      <div class="ml-4 flex shrink-0 items-center gap-2">
        <button
          type="button"
          (click)="edit.emit(item)"
          aria-label="Editar"
          class="flex size-10 cursor-pointer items-center justify-center rounded-xl border border-gray-200 bg-white text-muted-foreground transition-colors hover:border-primary/30 hover:bg-primary/10 hover:text-primary"
        >
          <span [innerHTML]="editIcon"></span>
        </button>

        <button
          type="button"
          (click)="delete.emit(item)"
          aria-label="Excluir"
          class="flex size-10 cursor-pointer items-center justify-center rounded-xl border border-red-100 bg-white text-destructive transition-colors hover:bg-destructive/10"
        >
          <span [innerHTML]="deleteIcon"></span>
        </button>
      </div>
    </div>
  } @empty {
    <div class="flex flex-col items-center justify-center px-6 py-16 text-center">
      <div class="gradient-primary mb-4 flex h-14 w-14 items-center justify-center rounded-2xl shadow-[0_12px_28px_rgba(2,145,68,0.22)]">
        <svg
          class="h-7 w-7 text-white"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.7"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M20.25 7.5l-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25"
          />
        </svg>
      </div>

      <p class="text-[15px] font-bold text-foreground">
        Nenhum item encontrado
      </p>

      <p class="mt-1 max-w-sm text-sm text-muted-foreground">
        Clique no botão de criação para adicionar o primeiro registro.
      </p>
    </div>
  }
</div>
