<div class="login-wrapper">
  
  <div class="login-left">

    <img src="paranalogo.png" alt="Mapa do Paraná" class="mb-6 w-48 object-contain mx-auto" />

    <p class="login-brand-title">Conecta Paraná</p>
    <p class="login-brand-sub"> Plataforma de serviços municipais para o estado do Paraná.</p>
  
  </div>

  <div class="login-divider"></div>
  
  <div class="login-right">

    <div class="login-card">

      <p class="login-card-title">Painel Administrativo</p>
      <p class="login-card-sub">Entre com suas credenciais para continuar</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

        <app-form-field
          label="E-mail"
          fieldId="email"
          [required]="true"
          [showError]="emailTouched && !!emailError"
          [errorMessage]="emailError"
        >
          <input
            id="email"
            formControlName="email"
            type="email"
            placeholder="email@gmail.com"
            class="w-full rounded-md border border-border px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary"
          />
        </app-form-field>

        <app-form-field
          label="Senha"
          fieldId="password"
          [required]="true"
          [showError]="passwordTouched && !!passwordError"
          [errorMessage]="passwordError"
        >
          <input
            id="password"
            formControlName="password"
            type="password"
            placeholder="••••••••"
            class="w-full rounded-md border border-border px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary"
          />
        </app-form-field>

        <a href="#" class="login-forgot" (click)="$event.preventDefault()">Esqueci minha senha</a>

        <div class="flex items-center gap-2">

          <input
            id="rememberMe"
            formControlName="rememberMe"
            type="checkbox"
            class="h-4 w-4 rounded border-gray-300 cursor-pointer accent-primary"
          />

          <label for="rememberMe" class="text-sm text-gray-700 cursor-pointer">
            Manter conectado
          </label>

        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-primary-dark disabled:cursor-not-allowed disabled:opacity-60 cursor-pointer"
        >
          @if (loading()) {
            <span class="login-spinner"></span>
            Entrando...
          } @else {
            Entrar
          }
        </button>

        @if (errorMessage(); as msg) {
          <div class="login-toast" role="alert">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <path stroke-linecap="round" d="M12 8v4m0 4h.01"/>
            </svg>
            {{ msg }}
          </div>
        }

      </form>

    </div>

  </div>

</div>
