<app-page-header title="NOTIFICAÇÕES" buttonLabel="Criar notificação" (create)="openForm()" />

@if (view() === 'list') {
  <div class="admin-card mt-5 flex flex-col items-center justify-center rounded-3xl px-8 py-16 text-center">
    <div
      class="gradient-primary mb-4 flex h-14 w-14 items-center justify-center rounded-2xl text-2xl font-bold text-white shadow-[0_12px_28px_rgba(2,145,68,0.22)]"
    >
      !
    </div>

    <h2 class="text-lg font-extrabold text-gray-900">
      Nenhuma notificação enviada ainda
    </h2>

    <p class="mt-2 max-w-md text-sm leading-6 text-gray-500">
      Crie notificações para avisar os cidadãos sobre eventos, comunicados e informações importantes.
    </p>

    <button
      type="button"
      (click)="openForm()"
      class="gradient-primary mt-5 rounded-2xl px-5 py-2.5 text-sm font-bold text-white shadow-[0_10px_24px_rgba(2,145,68,0.24)] transition hover:brightness-105 active:scale-[0.98]"
    >
      Criar primeira notificação
    </button>
  </div>
} @else {
  <app-form-container title="CRIAR NOTIFICAÇÃO">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <app-form-field
          label="Título"
          fieldId="title"
          [required]="true"
          [showError]="titleTouched && !!titleError"
          [errorMessage]="titleError"
        >
          <input
            id="title"
            formControlName="title"
            type="text"
            placeholder="Digite o título"
            class="w-full rounded-xl border-0 bg-input-bg px-3 py-2.5 text-sm text-gray-900 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary"
          />
        </app-form-field>

        <app-form-field label="Categoria" fieldId="type" [required]="true">
          <select
            id="type"
            formControlName="type"
            class="w-full rounded-xl border-0 bg-input-bg px-3 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary"
          >
            <option value="" disabled>Selecione a categoria...</option>
            <option value="event">Evento</option>
            <option value="post">Postagem</option>
            <option value="news">Notícia</option>
            <option value="system">Sistema</option>
          </select>
        </app-form-field>
      </div>

      <app-form-field
        label="Descrição"
        fieldId="description"
        [required]="true"
        [showError]="descriptionTouched && !!descriptionError"
        [errorMessage]="descriptionError"
      >
        <textarea
          id="description"
          formControlName="description"
          rows="4"
          placeholder="Digite a descrição da notificação"
          class="w-full resize-none rounded-xl border-0 bg-input-bg px-3 py-2.5 text-sm text-gray-900 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary"
        ></textarea>
      </app-form-field>

      <div class="flex items-start gap-3 rounded-2xl border border-yellow-200 bg-yellow-50 p-4">
        <span class="text-lg">⚠️</span>

        <p class="text-sm leading-relaxed text-gray-700">
          Esta notificação será enviada para todos os usuários da sua cidade.
        </p>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          (click)="closeForm()"
          class="cursor-pointer rounded-xl bg-btn-cancel px-5 py-2.5 text-sm font-bold text-white transition-colors hover:bg-btn-cancel-hover"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="gradient-primary cursor-pointer rounded-xl px-5 py-2.5 text-sm font-bold text-white shadow-[0_10px_24px_rgba(2,145,68,0.24)] transition hover:brightness-105 active:scale-[0.98]"
        >
          Enviar Notificação
        </button>
      </div>
    </form>
  </app-form-container>
}
