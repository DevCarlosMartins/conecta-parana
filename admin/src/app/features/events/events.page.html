@if (view() === 'list') {
  <app-page-header title="EVENTOS" buttonLabel="Criar evento" (create)="openForm()" />

  @if (loading()) {
    <p class="mt-6 text-sm text-gray-500">Carregando eventos...</p>
  } @else if (items().length === 0) {
    <p class="mt-6 text-sm text-gray-500">Nenhum evento cadastrado ainda.</p>
  } @else {
    <div class="mt-4 space-y-3">
      @for (item of items(); track item.id) {
        <div class="flex items-center justify-between rounded-lg border border-border bg-content-bg px-5 py-4">
          <div>
            <p class="font-medium text-gray-900">{{ item.title }}</p>
            <p class="text-sm text-gray-500">{{ item.type }} · {{ item.status }}</p>
          </div>
          <div class="flex gap-2">
            <button
              type="button"
              (click)="openEditForm(item)"
              class="rounded-md p-1.5 text-gray-500 hover:bg-gray-100 cursor-pointer"
              aria-label="Editar"
            >
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Z"/>
              </svg>
            </button>
            <button
              type="button"
              (click)="onDelete(item.id)"
              class="rounded-md p-1.5 text-red-500 hover:bg-red-50 cursor-pointer"
              aria-label="Excluir"
            >
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
              </svg>
            </button>
          </div>
        </div>
      }
    </div>
  }

} @else {
  <app-form-container title="CRIAR EVENTO">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- Título / Tipo -->
      <div class="grid grid-cols-2 gap-4">
        <app-form-field label="Título" fieldId="title" [required]="true" [showError]="titleTouched && !!titleError" [errorMessage]="titleError">
          <input id="title" formControlName="title" type="text" placeholder="Digite o título do evento"
            class="w-full rounded-md border-0 bg-input-bg px-3 py-2 text-sm text-gray-900 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary" />
        </app-form-field>

        <app-form-field label="Tipo" fieldId="type" [required]="true" [showError]="typeTouched && !!typeError" [errorMessage]="typeError">
          <select id="type" formControlName="type"
            class="w-full rounded-md border-0 bg-input-bg px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary">
            <option value="" disabled>Selecione...</option>
            @for (t of eventTypes; track t.value) {
              <option [value]="t.value">{{ t.label }}</option>
            }
          </select>
        </app-form-field>
      </div>

      <!-- Descrição -->
      <app-form-field label="Descrição" fieldId="description" [required]="true" [showError]="descriptionTouched && !!descriptionError" [errorMessage]="descriptionError">
        <textarea id="description" formControlName="description" rows="4" placeholder="Digite a descrição do evento"
          class="w-full rounded-md border-0 bg-input-bg px-3 py-2 text-sm text-gray-900 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
      </app-form-field>

      <!-- Data / Status -->
      <div class="grid grid-cols-2 gap-4">
        <app-form-field label="Data do Evento" fieldId="eventDate" [required]="true" [showError]="eventDateTouched && !!eventDateError" [errorMessage]="eventDateError">
          <input id="eventDate" formControlName="eventDate" type="datetime-local"
            class="w-full rounded-md border-0 bg-input-bg px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary" />
        </app-form-field>

        <app-form-field label="Status" fieldId="status" [required]="true" [showError]="false" [errorMessage]="''">
          <select id="status" formControlName="status"
            class="w-full rounded-md border-0 bg-input-bg px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary">
            @for (s of statusOptions; track s.value) {
              <option [value]="s.value">{{ s.label }}</option>
            }
          </select>
        </app-form-field>
      </div>

      <!-- Latitude / Longitude -->
      <div class="grid grid-cols-2 gap-4">
        <app-form-field label="Latitude (opcional)" fieldId="latitude" [required]="false" [showError]="latitudeTouched && !!latitudeError" [errorMessage]="latitudeError">
          <input id="latitude" formControlName="latitude" type="number" step="any" placeholder="-23.4253"
            class="w-full rounded-md border-0 bg-input-bg px-3 py-2 text-sm text-gray-900 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary" />
        </app-form-field>

        <app-form-field label="Longitude (opcional)" fieldId="longitude" [required]="false" [showError]="longitudeTouched && !!longitudeError" [errorMessage]="longitudeError">
          <input id="longitude" formControlName="longitude" type="number" step="any" placeholder="-51.9383"
            class="w-full rounded-md border-0 bg-input-bg px-3 py-2 text-sm text-gray-900 placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary" />
        </app-form-field>
      </div>

      <!-- Ações -->
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="closeForm()"
          class="rounded-lg bg-btn-cancel px-5 py-2 text-sm font-bold text-white transition-colors hover:bg-btn-cancel-hover cursor-pointer">
          Cancelar
        </button>
        <button type="submit"
          class="rounded-lg bg-btn-create px-5 py-2 text-sm font-bold text-white transition-colors hover:bg-btn-create-hover cursor-pointer">
          {{ editingId() ? 'Atualizar Evento' : 'Criar Evento' }}
        </button>
      </div>

    </form>
  </app-form-container>
}
